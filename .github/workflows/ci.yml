name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run templates:check
      - run: npm run pack:check
      - run: npm run types:check

  release-candidate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: emdash-mika
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: bnomei/emdash-mika-template
          ref: 16dddd06f9a7032270b8d031b4dadca04856fce0
          path: emdash-mika-template
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: bnomei/emdash-mika-docs
          ref: 958aacd817de3f0a5a4ef1bfabee6d410ed8e867
          path: emdash-mika-docs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            emdash-mika/package-lock.json
            emdash-mika-template/package-lock.json
            emdash-mika-docs/package-lock.json
      - run: npm install --global npm@11.16.0
      - run: test "$(node --version)" = "v22.13.0" && test "$(npm --version)" = "11.16.0"
      - run: npm ci
        working-directory: emdash-mika
      - run: npm run release:check
        working-directory: emdash-mika
